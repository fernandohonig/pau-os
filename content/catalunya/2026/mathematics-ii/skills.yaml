# Matemàtiques II — Catalunya PAU skill graph
# ---------------------------------------------------------------------------
# Organised around the four exam blocks: Anàlisi (Analysis), Àlgebra lineal
# (Linear Algebra), Geometria (Geometry), Probabilitat i Estadística.
# Each block has a root skill (no prerequisites) with more specific skills
# hanging off it. `parent` is taxonomic; `prerequisites` is pedagogical order.
# All IDs use dot notation. Prerequisites and parents must form a DAG.
# ===========================================================================

