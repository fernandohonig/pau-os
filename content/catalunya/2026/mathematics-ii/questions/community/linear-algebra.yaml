  question:
    ca: "Quina és la dimensió del producte d'una matriu 2×3 per una matriu 3×4?"
    es: "¿Cuál es la dimensión del producto de una matriz 2×3 por una matriz 3×4?"
  options:
    - { id: A, ca: "2×4", es: "2×4" }
    - { id: B, ca: "3×3", es: "3×3" }
    - { id: C, ca: "2×3", es: "2×3" }
    - { id: D, ca: "No es pot multiplicar", es: "No se puede multiplicar" }
  answer: { type: single, correct: A }
  explanation:
    ca: "El producte (m×n)·(n×p) té dimensió m×p. Aquí (2×3)·(3×4) = 2×4. Les dimensions interiors (3) coincideixen."
    es: "El producto (m×n)·(n×p) tiene dimensión m×p. Aquí (2×3)·(3×4) = 2×4. Las dimensiones interiores (3) coinciden."
