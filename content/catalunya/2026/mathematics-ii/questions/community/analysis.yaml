  question:
    ca: "En quin punt té un mínim la funció f(x) = x² - 4x + 1?"
    es: "¿En qué punto tiene un mínimo la función f(x) = x² - 4x + 1?"
  options:
    - { id: A, ca: "x = 2", es: "x = 2" }
    - { id: B, ca: "x = -2", es: "x = -2" }
    - { id: C, ca: "x = 4", es: "x = 4" }
    - { id: D, ca: "x = 0", es: "x = 0" }
  answer: { type: single, correct: A }
  explanation:
    ca: "f'(x) = 2x - 4 = 0 → x = 2. Com que f''(x) = 2 > 0, és un mínim."
    es: "f'(x) = 2x - 4 = 0 → x = 2. Como f''(x) = 2 > 0, es un mínimo."
