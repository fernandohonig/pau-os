question:
  ca: "Factoritza el polinomi x² - 5x + 6"
  es: "Factoriza el polinomio x² - 5x + 6"

options:
  - id: A
    ca: "(x - 2)(x - 3)"
    es: "(x - 2)(x - 3)"
  - id: B
    ca: "(x + 2)(x + 3)"
    es: "(x + 2)(x + 3)"
  - id: C
    ca: "(x - 1)(x - 6)"
    es: "(x - 1)(x - 6)"
  - id: D
    ca: "(x - 2)(x + 3)"
    es: "(x - 2)(x + 3)"

answer:
  type: single
  correct: A

explanation:
  ca: "Busquem dos números que multipliquin 6 i que sumin -5. Aquests són -2 i -3. Per tant, x² - 5x + 6 = (x - 2)(x - 3)."
  es: "Buscamos dos números que multipliquen 6 y que sumen -5. Estos son -2 y -3. Por tanto, x² - 5x + 6 = (x - 2)(x - 3)."

