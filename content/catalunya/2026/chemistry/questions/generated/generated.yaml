    es: Según el modelo de Bohr, la energía de los niveles del átomo de hidrógeno es
      E_n = −13,6/n^2 (en eV). ¿Qué longitud de onda tiene el fotón emitido en
      la transición de n = 3 a n = 2? (Usad hc ≈ 1240 eV·nm.)
  options:
