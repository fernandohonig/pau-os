  question:
    ca: "La Llei de Fitts, molt utilitzada en ergonomia cognitiva i disseny
      d'interfícies, prediu que el temps per assolir un objectiu (per exemple,
      clicar un botó) DISMINUEIX quan:"
    es: "La Ley de Fitts, muy utilizada en ergonomía cognitiva y diseño de
      interfaces, predice que el tiempo para alcanzar un objetivo (por ejemplo,
      hacer clic en un botón) DISMINUYE cuando:"
  options:
    - id: A
      ca: L'objectiu és més gran i està més a prop del punt de partida.
      es: El objetivo es más grande y está más cerca del punto de partida.
    - id: B
      ca: L'objectiu és més petit i està més a prop del punt de partida.
      es: El objetivo es más pequeño y está más cerca del punto de partida.
    - id: C
      ca: L'objectiu és més gran i està més lluny del punt de partida.
      es: El objetivo es más grande y está más lejos del punto de partida.
    - id: D
      ca: El temps només depèn de la mida de l'objectiu i és independent de la
        distància.
      es: El tiempo solo depende del tamaño del objetivo y es independiente de la
        distancia.
  answer:
    type: single
    correct: A
  explanation:
    ca: "La Llei de Fitts estableix que el temps de moviment creix amb la distància
      (D) fins a l'objectiu i decreix amb la seva amplada (W): T = a +
      b·log2(2D/W). Per tant, el temps és mínim quan l'objectiu és GRAN (W gran)
      i PROP (D petita). L'opció D és falsa perquè la distància hi intervé de
      manera determinant."
    es: "La Ley de Fitts establece que el tiempo de movimiento crece con la
      distancia (D) hasta el objetivo y decrece con su anchura (W): T = a +
      b·log2(2D/W). Por tanto, el tiempo es mínimo cuando el objetivo es GRANDE
      (W grande) y está CERCA (D pequeña). La opción D es falsa porque la
      distancia interviene de forma determinante."
