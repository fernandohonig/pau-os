      termoestable (termofijo)?
  options:
    - id: A
      ca: El termoplàstic es pot fondre i reconformar diverses vegades amb l'escalfor,
        mentre que el termoestable endureix de manera permanent i, en
        escalfar-lo, es degrada en lloc de tornar a fondre's.
      es: El termoplástico se puede fundir y reconformar varias veces con el calor,
        mientras que el termoestable endurece de forma permanente y, al
        calentarlo, se degrada en lugar de volver a fundirse.
    - id: B
      ca: El termoestable es pot tornar a fondre moltes vegades, mentre que el
        termoplàstic endureix de manera irreversible.
      es: El termoestable se puede volver a fundir muchas veces, mientras que el
        termoplástico endurece de forma irreversible.
