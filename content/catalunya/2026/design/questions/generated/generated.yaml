      una fuerza exterior desplaza el punto en una dirección. La opción C
      describe el crecimiento de un punto (que tendería a leerse como un plano,
      no una línea); la opción B corresponde a la intersección de planos (una
      arista) y la D a un contorno por contraste cromático, que no es la
      definición generativa de la línea."
