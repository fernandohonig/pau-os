    es: La mediatriz es la recta perpendicular al segmento por su punto medio y, por
      definición, es el conjunto de todos los puntos que equidistan de los
      extremos A y B. Esa propiedad permite construirla con dos arcos de igual
      radio centrados en A y en B. La opción C describiría una circunferencia, y
