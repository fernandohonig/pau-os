  question:
    ca: En una circumferència de radi R, quina és la longitud del costat del hexàgon
      regular inscrit?
    es: En una circunferencia de radio R, ¿cuál es la longitud del lado del hexágono
      regular inscrito?
  options:
    - id: A
      ca: És igual a R.
      es: Es igual a R.
    - id: B
      ca: És igual a R·√2.
      es: Es igual a R·√2.
    - id: C
      ca: És igual a R·√3.
      es: Es igual a R·√3.
    - id: D
      ca: És igual a R/2.
      es: Es igual a R/2.
  answer:
    type: single
    correct: A
  explanation:
    ca: L'angle central del hexàgon regular és 360°/6 = 60°, de manera que cada
      triangle format pel centre i un costat és equilàter; per tant el costat és
      igual al radi (L = R). Aquesta és la base de la construcció del hexàgon
      portant el radi sis vegades sobre la circumferència. R·√2 és el costat del
      quadrat inscrit i R·√3 el del triangle equilàter inscrit.
    es: El ángulo central del hexágono regular es 360°/6 = 60°, por lo que cada
      triángulo formado por el centro y un lado es equilátero; en consecuencia
      el lado es igual al radio (L = R). Esta es la base de la construcción del
      hexágono llevando el radio seis veces sobre la circunferencia. R·√2 es el
      lado del cuadrado inscrito y R·√3 el del triángulo equilátero inscrito.
