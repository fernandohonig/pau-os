  question:
    ca: En una sessió de cinema es venen 200 entrades i es recapten 1360 €.
      L'entrada d'adult val 8 € i la infantil 5 €. Quantes entrades d'adult i
      quantes infantils s'han venut?
    es: En una sesión de cine se venden 200 entradas y se recaudan 1360 €. La
      entrada de adulto cuesta 8 € y la infantil 5 €. ¿Cuántas entradas de
      adulto y cuántas infantiles se han vendido?
  options:
    - id: A
      ca: 120 d'adult i 80 infantils
      es: 120 de adulto y 80 infantiles
    - id: B
      ca: 80 d'adult i 120 infantils
      es: 80 de adulto y 120 infantiles
    - id: C
      ca: 100 d'adult i 100 infantils
      es: 100 de adulto y 100 infantiles
    - id: D
      ca: 140 d'adult i 60 infantils
      es: 140 de adulto y 60 infantiles
  answer:
    type: single
    correct: A
  explanation:
    ca: "Sigui a el nombre d'adults i c el d'infantils: a + c = 200 i 8a + 5c =
      1360. Aïllant c = 200 − a i substituint: 8a + 5(200 − a) = 1360 → 8a +
      1000 − 5a = 1360 → 3a = 360 → a = 120. Aleshores c = 80."
    es: "Sea a el número de adultos y c el de infantiles: a + c = 200 y 8a + 5c =
      1360. Despejando c = 200 − a y sustituyendo: 8a + 5(200 − a) = 1360 → 8a +
