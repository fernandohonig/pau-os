  question:
    ca: Segons l'índex d'aridesa de Gaussen, un mes és sec (àrid) quan la
      precipitació (en mm) és inferior al doble de la temperatura mitjana (en
      °C), és a dir, quan P < 2T. En una estació de clima mediterrani, el mes de
      juliol té una temperatura mitjana de 25 °C i una precipitació de 15 mm. El
      juliol és un mes sec?
    es: Según el índice de aridez de Gaussen, un mes es seco (árido) cuando la
      precipitación (en mm) es inferior al doble de la temperatura media (en
      °C), es decir, cuando P < 2T. En una estación de clima mediterráneo, el
      mes de julio tiene una temperatura media de 25 °C y una precipitación de
      15 mm. ¿Es julio un mes seco?
  options:
    - id: A
      ca: Sí, perquè P (15 mm) < 2T (50), i per tant es compleix la condició
        d'aridesa.
      es: Sí, porque P (15 mm) < 2T (50), y por tanto se cumple la condición de
        aridez.
    - id: B
      ca: No, perquè P (15 mm) > T/2 (12,5), de manera que no hi ha aridesa.
      es: No, porque P (15 mm) > T/2 (12,5), de modo que no hay aridez.
    - id: C
      ca: No, perquè 15 mm de pluja és suficient i cap mes amb precipitació pot
        considerar-se sec.
      es: No, porque 15 mm de lluvia es suficiente y ningún mes con precipitación
        puede considerarse seco.
    - id: D
      ca: Sí, però únicament perquè la temperatura supera els 20 °C, amb independència
        de la pluja.
      es: Sí, pero únicamente porque la temperatura supera los 20 °C, con
        independencia de la lluvia.
  answer:
    type: single
    correct: A
  explanation:
    ca: El criteri de Gaussen és P < 2T. Amb T = 25 °C, el llindar és 2T = 50 mm.
      Com que P = 15 mm < 50 mm, el mes es classifica com a sec/àrid. L'opció B
      usa el llindar erroni T/2; l'opció C ignora el criteri quantitatiu;
      l'opció D només mira la temperatura, però la sequedat depèn de la relació
      entre P i 2T.
    es: El criterio de Gaussen es P < 2T. Con T = 25 °C, el umbral es 2T = 50 mm.
      Como P = 15 mm < 50 mm, el mes se clasifica como seco/árido. La opción B
