    ca: Quin dels parells de mots següents forma una rima CONSONANT (total)?
    es: ¿Cuál de los siguientes pares de palabras forma una rima CONSONANTE (total)?
  options:
    - id: A
      ca: cor / amor
      es: cor / amor
    - id: B
      ca: fosca / cosa
      es: fosca / cosa
    - id: C
      ca: vida / mira
      es: vida / mira
    - id: D
      ca: poble / home
      es: poble / home
  answer:
    type: single
    correct: A
  explanation:
    ca: La rima és consonant quan coincideixen TOTES les vocals i consonants a
      partir de la darrera vocal tònica. En 'cor'/'amor' la part final és '-or'
      en tots dos casos (vocal 'o' + consonant 'r' idèntiques) → consonant. En
      canvi 'fosca/cosa' (o-a), 'vida/mira' (i-a) i 'poble/home' (o-e) només
      coincideixen en les vocals, no en les consonants → són rimes ASSONANTS,
      l'error típic de confondre-les amb consonants.
    es: La rima es consonante cuando coinciden TODOS los sonidos, vocálicos y
      consonánticos, a partir de la última vocal tónica. En 'cor'/'amor' la
      parte final es '-or' en ambos (vocal 'o' + consonante 'r' idénticas) →
      consonante. En cambio 'fosca/cosa' (o-a), 'vida/mira' (i-a) y 'poble/home'
      (o-e) solo coinciden en las vocales, no en las consonantes → son rimas
      ASONANTES, el error típico de confundirlas con consonantes.
