      formas a priori (espacio, tiempo y categorías), constituye el objeto tal
      como se nos aparece (el fenómeno). Así se hace posible el conocimiento
      universal y necesario. B describe precisamente la posición PREVIA que Kant
      rechaza; C toma la metáfora al pie de la letra; D es ajena al criticismo.
