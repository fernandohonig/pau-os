      copernicana». ¿En qué consiste este giro?
  options:
    - id: A
      ca: En lloc que el coneixement s'ajusti als objectes, són els objectes els que
        s'ajusten a les condicions a priori del subjecte que coneix.
      es: En lugar de que el conocimiento se ajuste a los objetos, son los objetos los
        que se ajustan a las condiciones a priori del sujeto que conoce.
    - id: B
      ca: El coneixement ha d'ajustar-se als objectes tal com són en si mateixos, amb
