      rebutja; C pren la metàfora al peu de la lletra; D és aliena al
      criticisme. Resposta: A."
    es: "Igual que Copérnico invirtió la relación poniendo el Sol en el centro en
      lugar de la Tierra, Kant invierte la relación entre sujeto y objeto: no es
