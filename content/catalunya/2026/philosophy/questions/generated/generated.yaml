      enganyar-nos fins i tot en les veritats matemàtiques. L'ordre correcte és
      A."
    es: "La duda avanza de menos a más radical. Primero Descartes desconfía de los
      sentidos porque a veces nos engañan (ilusiones, lejanía). Después, el
      argumento del sueño pone en duda incluso las cosas cercanas, ya que no hay
      señal segura para distinguir la vigilia del sueño. Finalmente, la
      hipótesis del genio maligno (o Dios engañador) es el grado extremo: podría
