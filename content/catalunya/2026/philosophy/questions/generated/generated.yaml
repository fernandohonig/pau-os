      y el tiempo no son cosas ni propiedades extraídas de la experiencia, sino
      las formas a priori bajo las cuales recibimos toda intuición: el tiempo es
      la forma del sentido interno y el espacio la del sentido externo. Por eso
      son «intuiciones puras». No pertenecen al entendimiento (las categorías,
      como causa o sustancia, se estudian en la Analítica: descarta B), no se
      abstraen de la experiencia porque la hacen posible (descarta C), y no son
