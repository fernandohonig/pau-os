      es: "Alma, mundo y Dios: ideas que no tienen un objeto dado en la experiencia y
        que, por tanto, no se pueden conocer, pero tienen un uso regulativo."
    - id: B
      ca: "Espai, temps i causalitat: condicions a priori que sí que produeixen
