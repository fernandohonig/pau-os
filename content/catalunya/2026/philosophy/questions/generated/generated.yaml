      permanente por la escasez y la igualdad de fuerzas. Para salir de él, los
      individuos pactan ceder casi todo su derecho a un soberano único y
      absoluto (el Leviatán) que garantice la seguridad. La opción C describe a
      Locke (derechos naturales preexistentes), la A describe a Rousseau
