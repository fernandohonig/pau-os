    es: Según Tomás de Aquino, ¿qué distingue a Dios de todas las criaturas respecto
      a la esencia y la existencia?
  options:
    - id: A
      ca: En les criatures essència i existència s'identifiquen, però en Déu es
        distingeixen
      es: En las criaturas esencia y existencia se identifican, pero en Dios se
        distinguen
    - id: B
      ca: En Déu essència i existència s'identifiquen (Déu és l'Ésser subsistent),
