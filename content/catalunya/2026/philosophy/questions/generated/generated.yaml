      coneixement?"
    es: "Kant afirma: «Los pensamientos sin contenido son vacíos; las intuiciones
      sin conceptos son ciegas.» ¿Qué expresa esta frase sobre el conocimiento?"
  options:
    - id: A
      ca: El coneixement exigeix la col·laboració de la sensibilitat (intuïcions) i de
        l'enteniment (conceptes).
      es: El conocimiento exige la colaboración de la sensibilidad (intuiciones) y del
        entendimiento (conceptos).
    - id: B
      ca: Tot coneixement deriva exclusivament de l'experiència sensible, com defensa
        l'empirisme.
      es: Todo conocimiento deriva exclusivamente de la experiencia sensible, como
        defiende el empirismo.
    - id: C
      ca: La raó, per si sola i sense els sentits, pot conèixer les coses en si
        mateixes.
      es: La razón, por sí sola y sin los sentidos, puede conocer las cosas en sí
        mismas.
    - id: D
      ca: Els conceptes són idees innates plenament formades abans de qualsevol
        experiència.
      es: Los conceptos son ideas innatas plenamente formadas antes de cualquier
        experiencia.
  answer:
