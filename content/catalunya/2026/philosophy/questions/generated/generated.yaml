      dels tres moments del dubte metòdic?
    es: En las 'Meditaciones metafísicas', Descartes ordena sus argumentos para
      dudar según un grado creciente de radicalidad. ¿Cuál es el orden correcto
      de los tres momentos de la duda metódica?
  options:
    - id: A
      ca: Error dels sentits → argument del somni → hipòtesi del geni maligne
