    es: En la duda metódica de Descartes, ¿por qué «cogito, ergo sum» (pienso, luego
      existo) es la primera verdad indudable?
  options:
    - id: A
      ca: Perquè, encara que dubti de tot o un geni maligne m'enganyi, el mateix acte
        de pensar garanteix que existeixo com a cosa que pensa.
      es: Porque, aunque dude de todo o un genio maligno me engañe, el propio acto de
        pensar garantiza que existo como cosa que piensa.
    - id: B
      ca: Perquè Déu, com a garant de la veritat, en demostra abans que res la
        certesa.
      es: Porque Dios, como garante de la verdad, demuestra antes que nada su certeza.
    - id: C
      ca: Perquè l'experiència sensible confirma amb seguretat que el meu cos
        existeix.
      es: Porque la experiencia sensible confirma con seguridad que mi cuerpo existe.
    - id: D
      ca: Perquè es dedueix lògicament a partir d'axiomes geomètrics evidents.
      es: Porque se deduce lógicamente a partir de axiomas geométricos evidentes.
  answer:
    type: single
    correct: A
  explanation:
    ca: "El cogito resisteix fins i tot la hipòtesi del geni maligne: si soc
      enganyat, he d'existir per ser enganyat, i el fet de dubtar ja és pensar.
      Per tant la meva existència com a res cogitans és certa. B inverteix
      l'ordre cartesià: Déu es demostra DESPRÉS del cogito, precisament per
      garantir la resta de coneixements. C és fals perquè el cos i els sentits
      ja han estat posats en dubte. D és fals: el cogito és una intuïció
      immediata, no una deducció."
    es: "El cogito resiste incluso la hipótesis del genio maligno: si soy engañado,
      debo existir para ser engañado, y dudar ya es pensar. Por ello mi
      existencia como res cogitans es cierta. B invierte el orden cartesiano:
      Dios se demuestra DESPUÉS del cogito, para garantizar el resto del
      conocimiento. C es falso porque el cuerpo y los sentidos ya han sido
      puestos en duda. D es falso: el cogito es una intuición inmediata, no una
      deducción."
