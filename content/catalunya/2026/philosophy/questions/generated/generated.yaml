  question:
    ca: Segons Plató, què distingeix l'episteme (coneixement veritable) de la doxa
      (opinió)?
    es: Según Platón, ¿qué distingue a la episteme (conocimiento verdadero) de la
      doxa (opinión)?
  options:
    - id: A
      ca: L'episteme té per objecte realitats universals i necessàries (les Idees) i
        es justifica racionalment, mentre que la doxa versa sobre el món
        sensible i canviant.
      es: La episteme tiene por objeto realidades universales y necesarias (las Ideas)
        y se justifica racionalmente, mientras que la doxa versa sobre el mundo
        sensible y cambiante.
    - id: B
      ca: L'episteme procedeix dels sentits i la doxa procedeix de la raó.
      es: La episteme procede de los sentidos y la doxa procede de la razón.
    - id: C
      ca: Totes dues es refereixen al món sensible, però l'episteme és simplement una
        mica més certa.
      es: Ambas se refieren al mundo sensible, pero la episteme es simplemente algo
        más cierta.
    - id: D
      ca: La doxa és sempre falsa i l'episteme sempre vertadera, sense cap grau
        intermedi de coneixement.
      es: La doxa es siempre falsa y la episteme siempre verdadera, sin ningún grado
        intermedio de conocimiento.
  answer:
    type: single
    correct: A
  explanation:
    ca: Per a Plató el coneixement autèntic (episteme) es dirigeix al món
      intel·ligible de les Idees, que són universals, immutables i necessàries,
      i s'assoleix mitjançant la raó (dialèctica). La doxa, en canvi, es
      refereix al món sensible, que és canviant i particular. B inverteix
      l'origen (els sentits donen doxa, no episteme). C confon els dos mons. D
      és falsa perquè Plató admet graus intermedis (p. ex. la pistis o la
      creença dins de la doxa).
    es: Para Platón el conocimiento auténtico (episteme) se dirige al mundo
      inteligible de las Ideas, universales, inmutables y necesarias, y se
      alcanza mediante la razón (dialéctica). La doxa se refiere al mundo
      sensible, cambiante y particular. B invierte el origen (los sentidos dan
      doxa, no episteme). C confunde ambos mundos. D es falsa porque Platón
      admite grados intermedios (p. ej. la pistis o creencia dentro de la doxa).
