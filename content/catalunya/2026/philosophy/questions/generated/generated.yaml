      opcions descriuen Kant (B), confonen inversió amb supressió (C) o
      introdueixen l'utilitarisme (D)."
    es: "La moral de esclavos opera una inversión (Umkehrung): el noble poderoso,
      antes 'bueno', es rebautizado como 'malvado' (böse), y las cualidades del
      débil (humildad, mansedumbre) pasan a ser 'buenas' (gut). Así se pasa del
      par bueno/malo (gut/schlecht) al par bien/mal (gut/böse). Las otras
