      processos quantitatius: la rarefacció (disminució de densitat), que
      produeix foc, i la condensació (augment de densitat), que dóna
      successivament vent, núvol, aigua, terra i pedra. L'opció B inverteix els
      dos processos; C descriu l'atomisme de Demòcrit i D correspon a
      Empèdocles."
    es: "Para Anaxímenes toda la realidad es aire que se transforma por dos procesos
      cuantitativos: la rarefacción (disminución de densidad), que produce
      fuego, y la condensación (aumento de densidad), que da sucesivamente
      viento, nube, agua, tierra y piedra. La opción B invierte los dos
      procesos; C describe el atomismo de Demócrito y D corresponde a
      Empédocles."
