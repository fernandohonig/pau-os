      esquema, quina seqüència és correcta?
    es: Anaxímenes explica la diversidad de la physis a partir de un único arché, el
      aire, mediante dos procesos cuantitativos opuestos. Según su esquema, ¿qué
      secuencia es correcta?
  options:
    - id: A
      ca: En rarefer-se (menys densitat) l'aire esdevé foc; en condensar-se (més
        densitat) esdevé vent, núvol, aigua, terra i pedra
      es: Al enrarecerse (menor densidad) el aire se vuelve fuego; al condensarse
        (mayor densidad) se vuelve viento, nube, agua, tierra y piedra
    - id: B
      ca: En rarefer-se l'aire esdevé pedra i terra; en condensar-se esdevé foc
      es: Al enrarecerse el aire se vuelve piedra y tierra; al condensarse se vuelve
