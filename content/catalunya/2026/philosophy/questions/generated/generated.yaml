  question:
    ca: Kant classifica els judicis segons si el predicat afegeix informació nova
      (sintètic) o hi és contingut (analític) i segons si depenen de
      l'experiència (a posteriori) o no (a priori). Quin dels següents és un
      judici SINTÈTIC A PRIORI?
    es: Kant clasifica los juicios según si el predicado añade información nueva
      (sintético) o está contenido en él (analítico) y según si dependen de la
      experiencia (a posteriori) o no (a priori). ¿Cuál de los siguientes es un
      juicio SINTÉTICO A PRIORI?
  options:
    - id: A
      ca: «Tots els cossos són extensos.»
      es: «Todos los cuerpos son extensos.»
    - id: B
      ca: «7 + 5 = 12.»
      es: «7 + 5 = 12.»
    - id: C
      ca: «Aquesta taula és marró.»
      es: «Esta mesa es marrón.»
    - id: D
      ca: «El triangle té tres costats.»
      es: «El triángulo tiene tres lados.»
  answer:
    type: single
    correct: B
  explanation:
    ca: "Un judici sintètic a priori amplia el coneixement (sintètic) però és
      universal i necessari, independent de l'experiència (a priori). Per a
      Kant, «7 + 5 = 12» és sintètic (el concepte de 12 no està contingut en la
      simple unió de 7 i 5; cal la intuïció pura del temps per comptar) i a
      priori (necessari i universal). En canvi, A i D són analítics (l'extensió
      i els tres costats ja estan continguts en els conceptes de cos i
      triangle), i C és sintètic a posteriori (depèn de l'observació). Resposta:
      B."
    es: "Un juicio sintético a priori amplía el conocimiento (sintético) pero es
      universal y necesario, independiente de la experiencia (a priori). Para
      Kant, «7 + 5 = 12» es sintético (el concepto de 12 no está contenido en la
      mera unión de 7 y 5; hace falta la intuición pura del tiempo para contar)
      y a priori (necesario y universal). En cambio, A y D son analíticos (la
      extensión y los tres lados ya están contenidos en los conceptos de cuerpo
      y triángulo), y C es sintético a posteriori (depende de la observación).
      Respuesta: B."
