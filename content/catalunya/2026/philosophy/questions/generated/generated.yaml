      d'esclaus?
    es: En la moral de señores, la valoración originaria opone 'bueno' (=noble,
      fuerte) a 'malo' en sentido de vil o carente. ¿Cómo transforma esa
      oposición la moral de esclavos?
  options:
    - id: A
      ca: "Inverteix els valors: el que era 'bo' (el fort) esdevé 'malvat', i el que
        era 'dolent' (el dèbil) esdevé 'bo'"
      es: "Invierte los valores: lo que era 'bueno' (el fuerte) pasa a ser 'malvado',
        y lo que era 'malo/carente' (el débil) pasa a ser 'bueno'"
    - id: B
      ca: Manté idèntica l'oposició, però la fonamenta ara en la raó pràctica
      es: Mantiene idéntica la oposición, pero la fundamenta ahora en la razón
