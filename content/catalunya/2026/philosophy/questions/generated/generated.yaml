    es: "Para Tomás, en Dios la esencia (lo que es) coincide con la existencia (el
      hecho de ser): Dios es el Ipsum esse subsistens, ser necesario. En las
      criaturas, en cambio, la esencia no incluye la existencia —pueden existir
      o no—, por lo que reciben el ser de modo participado. La opción A invierte
