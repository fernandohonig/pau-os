      finalment s'hi dipositen a sobre nous estrats en una direcció diferent
      (aquí horitzontals). L'angle entre els dos conjunts de capes és el tret
      diagnòstic. La disconformitat (B) implica estrats paral·lels a banda i
      banda; la inconformitat (C) requereix que el substrat siguin roques ígnies
      o metamòrfiques; i un contacte concordant (D) no té llacuna ni angle.
    es: Una discordancia angular se produce cuando los estratos inferiores se
      depositan, después se pliegan o basculan (adquieren inclinación) y se
      erosionan, y finalmente se depositan encima nuevos estratos en una
      dirección diferente (aquí horizontales). El ángulo entre los dos conjuntos
      de capas es el rasgo diagnóstico. La disconformidad (B) implica estratos
      paralelos a ambos lados; la inconformidad (C) requiere que el sustrato
