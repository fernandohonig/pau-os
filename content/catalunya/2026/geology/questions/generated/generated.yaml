  question:
    ca: Dues roques ígnies tenen exactament la mateixa composició química i
      mineralògica, però una és fanerítica (cristalls grans, visibles a ull nu)
      i l'altra és afanítica (cristalls molt fins, no visibles). Quina és la
      causa principal d'aquesta diferència de textura?
    es: Dos rocas ígneas tienen exactamente la misma composición química y
      mineralógica, pero una es fanerítica (cristales grandes, visibles a simple
      vista) y la otra es afanítica (cristales muy finos, no visibles). ¿Cuál es
      la causa principal de esta diferencia de textura?
  options:
    - id: A
      ca: La roca fanerítica es va refredar lentament en profunditat i la afanítica
        ràpidament a la superfície o a prop d'ella.
      es: La roca fanerítica se enfrió lentamente en profundidad y la afanítica
        rápidamente en la superficie o cerca de ella.
    - id: B
      ca: La roca fanerítica té més contingut en sílice que la afanítica.
      es: La roca fanerítica tiene más contenido en sílice que la afanítica.
    - id: C
      ca: La roca afanítica es va refredar lentament en profunditat i la fanerítica
        ràpidament a la superfície.
      es: La roca afanítica se enfrió lentamente en profundidad y la fanerítica
        rápidamente en la superficie.
    - id: D
      ca: La roca fanerítica és sedimentària i la afanítica és metamòrfica.
      es: La roca fanerítica es sedimentaria y la afanítica es metamórfica.
  answer:
    type: single
    correct: A
  explanation:
    ca: Amb la mateixa composició, la textura depèn de la velocitat de refredament
      del magma. Un refredament lent (roques plutòniques/intrusives, en
      profunditat) dóna temps als cristalls per créixer grans → textura
      fanerítica. Un refredament ràpid (roques volcàniques/extrusives, a la
      superfície) no dóna temps i els cristalls queden petits → textura
      afanítica. La composició és la mateixa, per tant B és fals; C inverteix la
      relació i D confon el tipus de roca.
    es: Con la misma composición, la textura depende de la velocidad de enfriamiento
      del magma. Un enfriamiento lento (rocas plutónicas/intrusivas, en
      profundidad) da tiempo a que los cristales crezcan grandes → textura
      fanerítica. Un enfriamiento rápido (rocas volcánicas/extrusivas, en
      superficie) no da tiempo y los cristales quedan pequeños → textura
      afanítica. La composición es la misma, por tanto B es falso; C invierte la
      relación y D confunde el tipo de roca.
