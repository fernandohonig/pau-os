  question:
    ca: La unitat estructural bàsica dels silicats és el tetraedre [SiO4]. En el
      quars, de fórmula SiO2, cada oxigen és compartit per dos tetraedres. Quina
      és, doncs, la relació Si:O efectiva en el quars i quin tipus de silicat
      és?
    es: La unidad estructural básica de los silicatos es el tetraedro [SiO4]. En el
      cuarzo, de fórmula SiO2, cada oxígeno es compartido por dos tetraedros.
      ¿Cuál es, entonces, la relación Si:O efectiva en el cuarzo y qué tipo de
      silicato es?
  options:
    - id: A
      ca: Relació 1:2; és un tectosilicat (estructura tridimensional)
      es: Relación 1:2; es un tectosilicato (estructura tridimensional)
    - id: B
      ca: Relació 1:4; és un nesosilicat (tetraedres aïllats)
      es: Relación 1:4; es un nesosilicato (tetraedros aislados)
    - id: C
      ca: Relació 1:3; és un fil·losilicat (làmines)
      es: Relación 1:3; es un filosilicato (láminas)
    - id: D
      ca: Relació 2:1; és un inosilicat (cadenes)
      es: Relación 2:1; es un inosilicato (cadenas)
  answer:
    type: single
    correct: A
  explanation:
    ca: "En un tetraedre aïllat la relació és Si:O = 1:4 (nesosilicats). Quan tots
      quatre oxígens de cada tetraedre es comparteixen amb tetraedres veïns,
      cada oxigen compta la meitat per a cada silici: 4 × 1/2 = 2 oxígens per
      silici, és a dir SiO2 (relació 1:2). Aquesta compartició total en les tres
      dimensions defineix un tectosilicat, com el quars."
    es: "En un tetraedro aislado la relación es Si:O = 1:4 (nesosilicatos). Cuando
      los cuatro oxígenos de cada tetraedro se comparten con tetraedros vecinos,
      cada oxígeno cuenta la mitad para cada silicio: 4 × 1/2 = 2 oxígenos por
      silicio, es decir SiO2 (relación 1:2). Esta compartición total en las tres
      dimensiones define un tectosilicato, como el cuarzo."
