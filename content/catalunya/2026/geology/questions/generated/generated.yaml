    es: En un corte geológico, unos estratos inferiores aparecen inclinados
      (basculados) y erosionados, y encima reposan, en posición horizontal, unos
      estratos más modernos que fosilizan esta superficie de erosión. ¿Qué tipo
      de discontinuidad estratigráfica (discordancia) representa esta relación?
  options:
    - id: A
      ca: Discordança angular.
      es: Discordancia angular.
    - id: B
      ca: Disconformitat (paraconformitat erosiva amb estrats paral·lels).
      es: Disconformidad (paraconformidad erosiva con estratos paralelos).
    - id: C
      ca: Inconformitat (discordança sobre roca ígnia o metamòrfica).
      es: Inconformidad (discordancia sobre roca ígnea o metamórfica).
