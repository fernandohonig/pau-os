  question:
    ca: En una esquerda d'una roca hi ha aigua que en congelar-se passa d'una
      densitat de 1000 kg/m3 a 920 kg/m3 (el gel). Considerant que la massa
      d'aigua es conserva, quin és aproximadament el canvi de volum en
      congelar-se?
    es: En una grieta de una roca hay agua que al congelarse pasa de una densidad de
      1000 kg/m3 a 920 kg/m3 (el hielo). Considerando que la masa de agua se
      conserva, ¿cuál es aproximadamente el cambio de volumen al congelarse?
  options:
    - id: A
      ca: El volum augmenta un ~9%.
      es: El volumen aumenta un ~9%.
