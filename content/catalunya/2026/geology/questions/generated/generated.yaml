      seguido de una fuerte disminución del oxígeno disuelto en el fondo y la
      muerte de peces. ¿Qué secuencia de causas explica correctamente este
      proceso de EUTROFIZACIÓN?
  options:
    - id: A
      ca: Aport excessiu de nutrients (nitrats i fosfats) → proliferació d'algues → en
        morir, la seva descomposició bacteriana consumeix l'oxigen dissolt →
        anòxia i mort de la fauna.
      es: Aporte excesivo de nutrientes (nitratos y fosfatos) → proliferación de algas
        → al morir, su descomposición bacteriana consume el oxígeno disuelto →
        anoxia y muerte de la fauna.
    - id: B
      ca: Augment de la temperatura de l'aigua → alliberament de CO2 → acidificació de
        l'aigua → dissolució de les roques del fons.
      es: Aumento de la temperatura del agua → liberación de CO2 → acidificación del
        agua → disolución de las rocas del fondo.
    - id: C
      ca: Excés d'oxigen per fotosíntesi → sobresaturació → formació de bombolles
        tòxiques → mort dels peixos per embòlia.
      es: Exceso de oxígeno por fotosíntesis → sobresaturación → formación de burbujas
        tóxicas → muerte de los peces por embolia.
    - id: D
      ca: Entrada de metalls pesants → bioacumulació en les algues → augment de la
        transparència de l'aigua → refredament del fons.
