      3.750), C divideix pel preu (80.000/40) i D divideix pel cost variable
      (80.000/24).
    es: Unidades = (Costes fijos + Beneficio objetivo) / (Precio - Coste variable
      unitario) = (60.000 + 20.000) / (40 - 24) = 80.000 / 16 = 5.000 unidades.
