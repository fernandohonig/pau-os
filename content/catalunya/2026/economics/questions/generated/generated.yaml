    - id: D
      ca: 2,40 €
      es: 2,40 €
  answer:
    type: single
    correct: A
  explanation:
    ca: "Cotització després de l'ampliació (ex-dret) = (4×8 + 1×5)/(4+1) = 37/5 =
      7,40 €. Valor del dret = cotització abans − cotització ex-dret = 8 − 7,40
      = 0,60 €. Equival a [accions noves/(antigues+noves)]×(cotització − preu
      emissió) = (1/5)×3 = 0,60 €. La B és la simple diferència de preus (8−5);
      la C usa 1/4 en comptes de 1/5; la D usa 4/5. Resposta correcta: A."
