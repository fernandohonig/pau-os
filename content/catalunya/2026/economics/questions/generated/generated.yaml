      venta unitario es 40 €, el coste variable unitario es 24 € y los costes
      fijos anuales son 60.000 €. ¿Cuántas unidades debe vender para alcanzar
      ese objetivo de beneficio?
  options:
    - id: A
      ca: 5.000 unitats.
      es: 5.000 unidades.
    - id: B
      ca: 3.750 unitats.
      es: 3.750 unidades.
    - id: C
      ca: 2.000 unitats.
      es: 2.000 unidades.
    - id: D
      ca: 3.333 unitats.
      es: 3.333 unidades.
