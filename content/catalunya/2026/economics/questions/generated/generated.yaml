  difficulty:
    initial: 0.8
  question:
    ca: Com a decisió de la variable preu, una empresa ven un producte a 25 € i en
      ven 1.000 unitats, amb un cost variable unitari de 12 €. Es planteja
      baixar el preu a 20 €, cosa que incrementaria les vendes fins a 1.400
      unitats. Des del punt de vista del marge de contribució total, què li
      convé?
    es: Como decisión de la variable precio, una empresa vende un producto a 25 € y
      vende 1.000 unidades, con un coste variable unitario de 12 €. Se plantea
      bajar el precio a 20 €, lo que incrementaría las ventas hasta 1.400
      unidades. Desde el punto de vista del margen de contribución total, ¿qué
      le conviene?
  options:
    - id: A
      ca: Baixar a 20 €, perquè obté un marge de contribució de 11.200 €
      es: Bajar a 20 €, porque obtiene un margen de contribución de 11.200 €
    - id: B
      ca: Mantenir 25 €, perquè el seu marge (13.000 €) supera el de baixar el preu
        (11.200 €)
      es: Mantener 25 €, porque su margen (13.000 €) supera el de bajar el precio
        (11.200 €)
    - id: C
      ca: És indiferent, perquè el marge de contribució total és el mateix en tots dos
        casos
      es: Es indiferente, porque el margen de contribución total es el mismo en ambos
        casos
    - id: D
      ca: Baixar a 20 €, perquè ven 400 unitats més
      es: Bajar a 20 €, porque vende 400 unidades más
  answer:
    type: single
    correct: B
  explanation:
    ca: "El marge de contribució total = (preu − cost variable unitari) × quantitat.
      A 25 €: (25 − 12) × 1.000 = 13 × 1.000 = 13.000 €. A 20 €: (20 − 12) ×
      1.400 = 8 × 1.400 = 11.200 €. Encara que baixar el preu augmenti les
      unitats venudes (400 més), el marge unitari cau de 13 € a 8 € i el marge
      total disminueix. Per tant convé mantenir el preu de 25 € (13.000 € >
      11.200 €). La resposta correcta és B."
    es: "El margen de contribución total = (precio − coste variable unitario) ×
      cantidad. A 25 €: (25 − 12) × 1.000 = 13 × 1.000 = 13.000 €. A 20 €: (20 −
      12) × 1.400 = 8 × 1.400 = 11.200 €. Aunque bajar el precio aumente las
      unidades vendidas (400 más), el margen unitario cae de 13 € a 8 € y el
      margen total disminuye. Por tanto conviene mantener el precio de 25 €
      (13.000 € > 11.200 €). La respuesta correcta es B."
