  question:
    ca: Una emprenedora obre una cafeteria amb costos fixos de 30.000 €/any. Cada
      consumició es ven a 25 € i té un cost variable de 15 €. Quantes
      consumicions ha de vendre a l'any per assolir el punt mort (llindar de
      rendibilitat)?
    es: Una emprendedora abre una cafetería con costes fijos de 30.000 €/año. Cada
      consumición se vende a 25 € y tiene un coste variable de 15 €. ¿Cuántas
      consumiciones debe vender al año para alcanzar el punto muerto (umbral de
      rentabilidad)?
  options:
    - id: A
      ca: 3.000 consumicions.
      es: 3.000 consumiciones.
    - id: B
      ca: 1.200 consumicions.
      es: 1.200 consumiciones.
    - id: C
      ca: 2.000 consumicions.
      es: 2.000 consumiciones.
    - id: D
      ca: 750 consumicions.
      es: 750 consumiciones.
  answer:
    type: single
    correct: A
  explanation:
    ca: El punt mort = Costos fixos / (Preu - Cost variable unitari) = 30.000 / (25
      - 15) = 30.000 / 10 = 3.000 unitats. L'error B divideix pel preu
      (30.000/25), l'error C divideix pel cost variable (30.000/15) i l'error D
      divideix per la suma preu+cost variable (30.000/40).
    es: El punto muerto = Costes fijos / (Precio - Coste variable unitario) = 30.000
      / (25 - 15) = 30.000 / 10 = 3.000 unidades. El error B divide por el
      precio (30.000/25), el error C divide por el coste variable (30.000/15) y
      el error D divide por la suma precio+coste variable (30.000/40).
