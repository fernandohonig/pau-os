  question:
    ca: Una empresa presenta uns costos fixos de 30.000 €, ven el seu producte a 25
      €/unitat i té un cost variable unitari de 10 €/unitat. Quin és el llindar
      de rendibilitat (punt mort), en unitats?
    es: Una empresa presenta unos costes fijos de 30.000 €, vende su producto a 25
      €/unidad y tiene un coste variable unitario de 10 €/unidad. ¿Cuál es el
      umbral de rentabilidad (punto muerto), en unidades?
  options:
    - id: A
      ca: 2.000 unitats
      es: 2.000 unidades
    - id: B
      ca: 1.200 unitats
      es: 1.200 unidades
    - id: C
      ca: 3.000 unitats
      es: 3.000 unidades
    - id: D
      ca: 857 unitats
      es: 857 unidades
  answer:
    type: single
    correct: A
  explanation:
    ca: El llindar de rendibilitat es calcula com Q* = CF / (P - CVu). Aquí Q* =
      30.000 / (25 - 10) = 30.000 / 15 = 2.000 unitats. L'error B surt de
      dividir pel preu (30.000/25 = 1.200), el C de dividir pel cost variable
      unitari (30.000/10 = 3.000) i el D de dividir per la suma P + CVu
      (30.000/35 ≈ 857).
    es: El umbral de rentabilidad se calcula como Q* = CF / (P - CVu). Aquí Q* =
      30.000 / (25 - 10) = 30.000 / 15 = 2.000 unidades. El error B resulta de
      dividir por el precio (30.000/25 = 1.200), el C de dividir por el coste
