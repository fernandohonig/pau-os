      d'emissió de 5 €. Quin és el valor teòric del dret de subscripció
      preferent?
    es: Una sociedad tiene 100.000 acciones que cotizan a 8 € cada una. Realiza una
      ampliación de capital emitiendo 1 acción nueva por cada 4 antiguas, a un
      precio de emisión de 5 €. ¿Cuál es el valor teórico del derecho de
      suscripción preferente?
  options:
    - id: A
      ca: 0,60 €
      es: 0,60 €
    - id: B
      ca: 3,00 €
      es: 3,00 €
