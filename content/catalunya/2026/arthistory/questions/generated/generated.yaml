      ocupi exactament l'angle de l'edifici. Com solucionaven principalment els
      arquitectes grecs aquest 'conflicte de l'angle dòric'?
    es: El friso dórico exige un triglifo centrado sobre el eje de cada columna y
      otro centrado en el intercolumnio, pero la norma también impone que un
      triglifo ocupe exactamente el ángulo del edificio. ¿Cómo solucionaban
      principalmente los arquitectos griegos este 'conflicto del ángulo dórico'?
  options:
    - id: A
      ca: Doblant l'amplada de la mètopa situada a l'angle.
      es: Duplicando la anchura de la metopa situada en el ángulo.
    - id: B
      ca: Contraient (reduint) lleugerament l'intercolumni dels extrems per desplaçar
        el tríglif fins a la cantonada.
      es: Contrayendo (reduciendo) ligeramente el intercolumnio de los extremos para
        desplazar el triglifo hasta la esquina.
    - id: C
      ca: Suprimint el darrer tríglif de cada costat i deixant només mètopes als
        angles.
      es: Suprimiendo el último triglifo de cada lado y dejando solo metopas en los
        ángulos.
    - id: D
      ca: Girant 45° el capitell de la columna angular.
      es: Girando 45° el capitel de la columna angular.
  answer:
    type: single
    correct: B
  explanation:
    ca: "La solució clàssica és la 'contracció de l'angle': s'escurça una mica
      l'últim intercolumni de cada façana perquè el tríglif de l'extrem arribi
      just a la cantonada de l'entaulament, mantenint alhora el ritme del fris.
      Doblar la mètopa (A) trencaria la regularitat; suprimir el tríglif (C)
      violaria la norma; i girar el capitell (D) no té cap fonament
      constructiu."
    es: "La solución clásica es la 'contracción del ángulo': se acorta ligeramente
      el último intercolumnio de cada fachada para que el triglifo del extremo
      llegue justo a la esquina del entablamento, manteniendo a la vez el ritmo
