      semicircular (de mig punt). Quant s'eleva la clau de la volta (l'intradós)
      per sobre de la línia d'imposta on arrenca l'arc?
    es: Una nave románica de 6 m de anchura se cubre con una bóveda de cañón de
      sección semicircular (de medio punto). ¿Cuánto se eleva la clave de la
      bóveda (el intradós) por encima de la línea de imposta donde arranca el
      arco?
  options:
    - id: A
      ca: 3 m
      es: 3 m
    - id: B
      ca: 6 m
      es: 6 m
    - id: C
      ca: 1,5 m
      es: 1,5 m
    - id: D
      ca: 4,5 m
      es: 4,5 m
  answer:
    type: single
    correct: A
  explanation:
    ca: "En un arc de mig punt (semicercle) el radi és la meitat de la llum: r = 6/2
