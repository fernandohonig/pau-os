      6/2 = 3 m. La flecha o elevación de la clave por encima de la imposta es
      exactamente el radio, es decir 3 m. Tomar 6 m confunde anchura con altura;
      1,5 m sería un cuarto de la luz; 4,5 m no corresponde a ninguna relación
      de un semicírculo."
