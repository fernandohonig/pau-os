  question:
    ca: Una partícula de càrrega q = +2 µC i massa m = 5,0×10^-6 kg es deixa anar
      des del repòs en un punt A on el potencial és V_A = 800 V i arriba a un
      punt B on V_B = 200 V. Quina és la seva rapidesa en B? (menyspreeu la
      gravetat)
    es: Una partícula de carga q = +2 µC y masa m = 5,0×10^-6 kg se suelta desde el
      reposo en un punto A donde el potencial es V_A = 800 V y llega a un punto
      B donde V_B = 200 V. ¿Cuál es su rapidez en B? (despreciad la gravedad)
  options:
    - id: A
      ca: 22 m/s
      es: 22 m/s
    - id: B
      ca: 16 m/s
      es: 16 m/s
    - id: C
      ca: 28 m/s
      es: 28 m/s
    - id: D
      ca: 480 m/s
      es: 480 m/s
  answer:
    type: single
    correct: A
  explanation:
