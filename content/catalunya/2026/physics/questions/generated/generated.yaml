      sqrt(2·1,2×10^-3/5,0×10^-6) = sqrt(480) ≈ 22 m/s. (B oblida el factor 2; C
      usa (V_A + V_B); D oblida l'arrel quadrada.)"
    es: "Por conservación de la energía: ½mv^2 = q(V_A - V_B). q(V_A - V_B) =
